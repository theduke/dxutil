[package]
name = "dxeditor"
description = "A Rust rich-text and Markdown editor for Dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/dxeditor"
readme = "README.md"

[features]
default = ["markdown", "web"]
markdown = ["dep:pulldown-cmark"]
web = ["dxutil/web", "dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
dioxus = { workspace = true, default-features = true }
dxutil.workspace = true
futures.workspace = true
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
pulldown-cmark = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v7", "js"] }
unicode-segmentation.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "Window", "Document", "HtmlDocument", "Element", "HtmlElement", "Node", "NodeList", "HtmlCollection", "Text", "CharacterData", "DocumentFragment",
  "Event", "EventTarget", "AddEventListenerOptions", "InputEvent", "InputEventInit", "KeyboardEvent", "KeyboardEventInit", "DragEventInit", "FilePropertyBag", "HtmlProgressElement", "CompositionEvent", "FocusEvent", "MouseEvent", "PointerEvent",
  "Range", "StaticRange", "AbstractRange", "Selection", "DomRect", "DomRectReadOnly", "DomRectList", "CaretPosition", "VisualViewport", "Performance",
  "ClipboardEvent", "ClipboardEventInit", "DataTransfer", "DataTransferItem", "DataTransferItemList", "DragEvent", "File", "FileList", "Blob", "FileReader",
  "DomParser", "SupportedType", "HtmlInputElement", "HtmlImageElement", "HtmlAnchorElement", "CssStyleDeclaration", "DomTokenList",
  "MutationObserver", "MutationObserverInit", "MutationRecord", "ResizeObserver", "ResizeObserverEntry", "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry",
  "Navigator", "Storage", "Location", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "Url", "console"
] }

[dev-dependencies]
dioxus-ssr.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
