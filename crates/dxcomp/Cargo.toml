[package]
name = "dxcomp"
description = "Prestyled Dioxus components, floating surfaces, and virtual lists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/dxcomp"
readme = "README.md"

[dependencies]
dioxus = { workspace = true, default-features = true, features = ["router"] }
dioxus-icons.workspace = true
dioxus-primitives.workspace = true
dxform = { workspace = true, optional = true }
dxutil.workspace = true
palette.workspace = true
serde.workspace = true
time = { workspace = true, features = ["macros"] }

[dev-dependencies]
dioxus-ssr.workspace = true

[features]
default = []
dxform = ["dep:dxform"]
web = ["dioxus/web", "dioxus-primitives/web"]
desktop = ["dioxus/desktop"]
fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "dioxus/fullstack"]
native = ["dioxus/native"]

[package.metadata.docs.rs]
features = ["dxform"]
