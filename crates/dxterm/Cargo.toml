[package]
name = "dxterm"
description = "A Rust terminal component for Dioxus web, desktop and Native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/dxterm"
readme = "README.md"

[features]
default = []
web = ["dioxus/web", "dxutil/web", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
desktop = ["dioxus/desktop", "dep:arboard"]
native = ["dioxus/native", "dep:arboard"]

[dependencies]
dxterm_core.workspace = true
dxutil.workspace = true
futures.workspace = true
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
dioxus = { workspace = true, default-features = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Navigator", "Clipboard", "Event", "ClipboardEvent", "DataTransfer", "Document", "Element", "HtmlTextAreaElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = ["HtmlElement", "KeyboardEvent", "KeyboardEventInit", "NodeList", "CssStyleDeclaration"] }

[[example]]
name = "desktop"
required-features = ["desktop"]

[[example]]
name = "native"
required-features = ["native"]
