[package]
name = "dxutil"
description = "Shared IDs, clocks, and browser listeners for Dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/dxutil"
readme = "README.md"

[features]
default = []
web = ["dep:web-sys", "dep:wasm-bindgen"]

[dependencies]
dioxus = { workspace = true, default-features = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Performance", "Event", "EventTarget"] }
