[package]
name = "dxcomp-primitives"
description = "Unstyled Dioxus components forked from dioxus-primitives for dxcomp"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = ["Dioxus Labs", "DogeDark", "Christoph Herzog <chris@theduke.at>"]
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/dxcomp-primitives"
readme = "README.md"

[package.metadata.upstream]
repository = "https://github.com/DioxusLabs/dioxus-components"
revision = "02801f27e4b3e30606e5c77e435c9d955c708eb3"
path = "primitives"
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { workspace = true, default-features = true }
dioxus-attributes.workspace = true
dioxus-sdk-time.workspace = true
time = { workspace = true, features = ["std", "macros", "parsing", "local-offset"] }
num-integer.workspace = true
tracing = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
palette.workspace = true

[build-dependencies]
lazy-js-bundle.workspace = true

[dev-dependencies]
dioxus-ssr.workspace = true

[features]
default = ["router"]
router = ["dioxus/router"]
web = ["time/wasm-bindgen"]
