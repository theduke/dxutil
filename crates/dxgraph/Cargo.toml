[package]
name = "dxgraph"
description = "A content-agnostic Dioxus graph canvas with native Rust layouts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/dxgraph"
readme = "README.md"

[features]
default = []
web = ["dxutil/web", "dep:web-sys", "dep:wasm-bindgen"]
demo = ["dioxus/desktop"]

[dependencies]
dioxus = { workspace = true, default-features = true }
dioxus-sdk-time.workspace = true
dxcomp.workspace = true
dxutil.workspace = true
serde = { workspace = true, features = ["derive"] }
indexmap = { workspace = true, features = ["serde"] }
thiserror.workspace = true
web-sys = { workspace = true, optional = true, features = ["Element", "HtmlElement", "FocusOptions", "Window", "DomRect", "Event", "EventTarget", "MediaQueryList"] }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
dioxus-html = { workspace = true, features = ["serialize"] }
serde_json.workspace = true
dioxus-ssr.workspace = true

[[example]]
name = "demo"
required-features = ["demo"]
