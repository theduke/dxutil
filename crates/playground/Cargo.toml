[package]
name = "dxplayground"
description = "Interactive component browser for the dxutil workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
web = ["dioxus/web", "dxcomp/web", "dxeditor/web", "dxgraph/web", "dxcode/web", "dxterm/web"]
desktop = ["dioxus/desktop", "dxcomp/desktop", "dxcode/desktop", "dxterm/desktop"]

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dxcomp = { path = "../dxcomp" }
dxeditor = { path = "../dxeditor", default-features = false, features = ["markdown"] }
dxgraph = { path = "../dxgraph" }
dxform = { path = "../dxform" }
dxcode = { path = "../dxcode", features = ["typescript"] }
dxterm = { path = "../dxterm" }
serde_json.workspace = true
