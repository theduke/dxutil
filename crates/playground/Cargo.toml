[package]
name = "dxplayground"
description = "Interactive component browser for the dxutil workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
publish = false
readme = "README.md"

[features]
default = []
web = ["dioxus/web", "dxcomp/web", "dxeditor/web", "dxgraph/web", "dxhighlight/web", "dxterm/web"]
desktop = ["dioxus/desktop", "dxcomp/desktop", "dxhighlight/desktop", "dxterm/desktop"]

[dependencies]
dioxus = { workspace = true, default-features = true, features = ["router"] }
dxcomp = { workspace = true, features = ["dxform"] }
dxeditor = { workspace = true, default-features = false, features = ["markdown"] }
dxgraph.workspace = true
dxform.workspace = true
dxhighlight = { workspace = true, features = ["typescript"] }
dxterm.workspace = true
serde_json.workspace = true
