[package]
name = "dxhighlight"
description = "Tree-sitter highlighting and a read-only code viewer for Dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/dxhighlight"
readme = "README.md"

[features]
default = ["viewer", "rust", "json"]
viewer = ["dep:dioxus", "dep:serde_json", "dep:futures", "dep:gloo-timers"]
# DOM conveniences are optional; token and line rendering never uses JavaScript.
dom = ["viewer"]
web = ["dom", "dioxus/web"]
desktop = ["dom", "dioxus/desktop"]
all-languages = ["rust", "javascript", "typescript", "tsx", "json", "toml", "yaml", "markdown", "html", "css", "python", "go", "bash", "sql", "c", "cpp"]
rust = ["dep:arborium-rust"]
javascript = ["dep:arborium-javascript"]
typescript = ["dep:arborium-typescript"]
tsx = ["dep:arborium-tsx"]
json = ["dep:arborium-json"]
toml = ["dep:arborium-toml"]
yaml = ["dep:arborium-yaml"]
markdown = ["dep:tree-sitter-md"]
html = ["dep:arborium-html"]
css = ["dep:arborium-css"]
python = ["dep:arborium-python"]
go = ["dep:arborium-go"]
bash = ["dep:arborium-bash"]
sql = ["dep:arborium-sql"]
c = ["dep:arborium-c"]
cpp = ["dep:arborium-cpp"]

[dependencies]
futures = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true, default-features = false, features = ["lib"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-md = { workspace = true, optional = true }
arborium-rust = { workspace = true, optional = true }
arborium-javascript = { workspace = true, optional = true }
arborium-typescript = { workspace = true, optional = true }
arborium-tsx = { workspace = true, optional = true }
arborium-json = { workspace = true, optional = true }
arborium-toml = { workspace = true, optional = true }
arborium-yaml = { workspace = true, optional = true }
arborium-html = { workspace = true, optional = true }
arborium-css = { workspace = true, optional = true }
arborium-python = { workspace = true, optional = true }
arborium-go = { workspace = true, optional = true }
arborium-bash = { workspace = true, optional = true }
arborium-sql = { workspace = true, optional = true }
arborium-c = { workspace = true, optional = true }
arborium-cpp = { workspace = true, optional = true }

[dev-dependencies]
dioxus-ssr.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true, features = ["futures"], optional = true }
