name: Dependency security

on:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]
    paths: [Cargo.lock, .github/workflows/security.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: make audit-rust

  javascript:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            crates/dxcode/web/package-lock.json
            crates/dxterm/web/package-lock.json
            crates/dxeditor/e2e/package-lock.json
      - run: make audit-js
