name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Formatting, lint, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make fmt lint docs

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: make check test

  features:
    name: Features (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, wasm, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install desktop dependencies
        if: matrix.mode == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: features-${{ matrix.mode }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check feature configuration
        env:
          MODE: ${{ matrix.mode }}
        run: |
          case "$MODE" in
            headless) make check-headless ;;
            wasm) make check-wasm ;;
            desktop) make check-desktop ;;
            *) exit 1 ;;
          esac

  javascript:
    name: JavaScript tests and bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            crates/dxcode/web/package-lock.json
            crates/dxterm/web/package-lock.json
            crates/dxeditor/e2e/package-lock.json
      - run: make install-js test-js check-bundles

  editor-browser:
    name: Editor WASM and browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: editor-browser
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/dxeditor/e2e/package-lock.json
      - name: Install pinned browser build tools
        run: bash scripts/install-browser-tools.sh
      - name: Install browser test dependencies
        run: |
          npm ci --prefix crates/dxeditor/e2e
          cd crates/dxeditor/e2e
          npx playwright install --with-deps chromium firefox webkit
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          install-chromedriver: true
      - name: Configure wasm browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'webdriver.json'
          path.write_text(json.dumps({'goog:chromeOptions': {
              'binary': os.environ['CHROME_PATH'],
              'args': ['--headless=new', '--no-sandbox', '--disable-dev-shm-usage'],
          }}))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'WASM_BINDGEN_TEST_WEBDRIVER_JSON={path}\n')
          PYTHON
      - name: Test editor in WASM and browsers
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: make test-editor-wasm test-editor-e2e
      - name: Upload browser reports and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-browser-results
          path: |
            crates/dxeditor/e2e/test-results
            crates/dxeditor/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: CI required
    if: ${{ always() }}
    needs: [quality, native, features, javascript, editor-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit(f"Required jobs did not succeed: {', '.join(failed)}")
          PYTHON
